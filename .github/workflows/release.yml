name: Release Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Build the unpacked Electron application first so its main executable
      # and native executable files can be signed before packaging.
      - name: Build unpacked Windows application
        run: npm run dist:win -- --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Locate unpacked Windows application
        id: windows-app
        shell: pwsh
        run: |
          $candidateFolders = @(
            "dist\win-unpacked",
            "dist\win-ia32-unpacked",
            "dist\win-arm64-unpacked"
          )

          $appFolder = $candidateFolders |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $appFolder) {
            $appFolder = Get-ChildItem -Path "dist" -Directory -Recurse |
              Where-Object { $_.Name -like "win*-unpacked" } |
              Select-Object -First 1 |
              ForEach-Object { $_.FullName }
          }

          if (-not $appFolder) {
            throw "Could not locate the unpacked Windows application."
          }

          $resolvedPath = (Resolve-Path $appFolder).Path
          "path=$resolvedPath" >> $env:GITHUB_OUTPUT

          Write-Host "Using unpacked application: $resolvedPath"

      - name: Sign unpacked Windows application
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}

          files-folder: ${{ steps.windows-app.outputs.path }}
          files-folder-filter: exe,dll,node
          files-folder-recurse: true

          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

          description: BrickVerse Installer
          description-url: https://brickverse.gg

      # Package the already-signed unpacked application. Using --prepackaged
      # prevents electron-builder from rebuilding and replacing the signed EXE.
      - name: Package Windows installer
        shell: pwsh
        run: |
          npx electron-builder `
            --win `
            --prepackaged "${{ steps.windows-app.outputs.path }}" `
            --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Collect Windows installer files
        id: windows-installers
        shell: pwsh
        run: |
          $unpackedPath = "${{ steps.windows-app.outputs.path }}"

          $files = Get-ChildItem -Path "dist" -File -Recurse |
            Where-Object {
              $_.FullName -notlike "$unpackedPath*" -and
              (
                $_.Extension -eq ".exe" -or
                $_.Extension -eq ".msi"
              )
            }

          if (-not $files) {
            throw "No Windows installer executable was generated."
          }

          $signingList = $files.FullName -join "`n"
          $releaseList = $files.FullName -join "`n"

          "files<<EOF" >> $env:GITHUB_OUTPUT
          $signingList >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

          "release_files<<EOF" >> $env:GITHUB_OUTPUT
          $releaseList >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

          Write-Host "Windows packages:"
          $files | ForEach-Object { Write-Host " - $($_.FullName)" }

      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}

          files: ${{ steps.windows-installers.outputs.files }}

          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

          description: BrickVerse Installer
          description-url: https://brickverse.gg

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $files = @"
          ${{ steps.windows-installers.outputs.files }}
          "@ -split "`r?`n" | Where-Object { $_ }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file

            Write-Host "$file"
            Write-Host "  Status: $($signature.Status)"
            Write-Host "  Signer: $($signature.SignerCertificate.Subject)"

            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $file. Status: $($signature.Status)"
            }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  build-unix:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: dist:mac
            artifact: installer-macos
          - name: Linux
            os: ubuntu-latest
            command: dist:linux
            artifact: installer-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run ${{ matrix.command }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish Release
    needs:
      - build-windows
      - build-unix

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

          find release -type f -print0 |
            xargs -0 gh release upload "$RELEASE_TAG" --clobber
