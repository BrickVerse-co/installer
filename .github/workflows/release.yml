name: Release Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build unpacked Windows application
        run: npm run dist:win -- --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Locate unpacked Windows application
        id: windows-app
        shell: pwsh
        run: |
          $candidateFolders = @(
            "release\win-unpacked",
            "release\win-ia32-unpacked",
            "release\win-arm64-unpacked"
          )

          $appFolder = $candidateFolders |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $appFolder) {
            $foundFolder = Get-ChildItem -Path "release" -Directory -Recurse |
              Where-Object { $_.Name -like "win*-unpacked" } |
              Select-Object -First 1

            if ($foundFolder) {
              $appFolder = $foundFolder.FullName
            }
          }

          if (-not $appFolder) {
            Write-Host "Contents of release:"
            Get-ChildItem -Path "release" -Recurse |
              ForEach-Object { Write-Host $_.FullName }

            throw "Could not locate the unpacked Windows application."
          }

          $resolvedPath = (Resolve-Path $appFolder).Path
          "path=$resolvedPath" >> $env:GITHUB_OUTPUT

          Write-Host "Using unpacked application: $resolvedPath"

      - name: Locate main application executable
        id: windows-executable
        shell: pwsh
        run: |
          $appFolder = "${{ steps.windows-app.outputs.path }}"

          # Prefer the executable whose name contains BrickVerse.
          $executable = Get-ChildItem -Path $appFolder -File -Filter "*.exe" |
            Where-Object {
              $_.Name -like "*BrickVerse*" -and
              $_.Name -notin @(
                "chrome_crashpad_handler.exe",
                "elevate.exe"
              )
            } |
            Select-Object -First 1

          # Fall back to the largest top-level executable, which is normally
          # the main Electron application executable.
          if (-not $executable) {
            $executable = Get-ChildItem -Path $appFolder -File -Filter "*.exe" |
              Where-Object {
                $_.Name -notin @(
                  "chrome_crashpad_handler.exe",
                  "elevate.exe"
                )
              } |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $executable) {
            throw "Could not locate the main BrickVerse executable."
          }

          "path=$($executable.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Main application executable: $($executable.FullName)"

      - name: Sign main Windows application
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}

          files: ${{ steps.windows-executable.outputs.path }}

          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

          description: BrickVerse Installer
          description-url: https://brickverse.gg

      - name: Verify main application signature
        shell: pwsh
        run: |
          $file = "${{ steps.windows-executable.outputs.path }}"
          $signature = Get-AuthenticodeSignature -FilePath $file

          Write-Host "File: $file"
          Write-Host "Status: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

          if ($signature.Status -ne "Valid") {
            throw "Main application signature is invalid: $($signature.Status)"
          }

      - name: Package Windows installer
        shell: pwsh
        run: |
          npx electron-builder `
            --win `
            --prepackaged "${{ steps.windows-app.outputs.path }}" `
            --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Locate final Windows packages
        id: windows-installers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "release" -File |
            Where-Object {
              $_.Extension -in @(".exe", ".msi")
            }

          if (-not $files) {
            Write-Host "Contents of release:"
            Get-ChildItem -Path "release" -Recurse |
              ForEach-Object { Write-Host $_.FullName }

            throw "No Windows installer package was generated."
          }

          "files<<EOF" >> $env:GITHUB_OUTPUT
          $files.FullName >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

          Write-Host "Windows packages:"
          $files | ForEach-Object {
            Write-Host " - $($_.FullName)"
          }

      - name: Sign final Windows packages
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}

          files: ${{ steps.windows-installers.outputs.files }}

          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

          description: BrickVerse Installer
          description-url: https://brickverse.gg

      - name: Verify final Windows signatures
        shell: pwsh
        run: |
          $files = @"
          ${{ steps.windows-installers.outputs.files }}
          "@ -split "`r?`n" |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file

            Write-Host "File: $file"
            Write-Host "Status: $($signature.Status)"
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"

            if ($signature.Status -ne "Valid") {
              throw "Invalid signature on $file: $($signature.Status)"
            }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            release/*.exe
            release/*.msi
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  build-unix:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: dist:mac
            artifact: installer-macos

          - name: Linux
            os: ubuntu-latest
            command: dist:linux
            artifact: installer-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run ${{ matrix.command }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Keep these only when you have a real Apple Developer certificate.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.pkg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish Release
    needs:
      - build-windows
      - build-unix

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

          find release-assets -type f -print0 |
            xargs -0 gh release upload "$RELEASE_TAG" --clobber
