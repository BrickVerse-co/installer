name: Release Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build application files
        run: npm run build

      - name: Build unpacked Windows application
        run: npx electron-builder --win --x64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Locate unpacked Windows application
        id: windows-app
        shell: pwsh
        run: |
          $appFolder = Get-ChildItem -Path "release" -Directory -Recurse |
            Where-Object { $_.Name -eq "win-unpacked" } |
            Select-Object -First 1

          if (-not $appFolder) {
            Write-Host "Contents of release:"
            Get-ChildItem -Path "release" -Recurse |
              ForEach-Object { Write-Host $_.FullName }
            throw "Could not locate release\\win-unpacked."
          }

          "path=$($appFolder.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using unpacked application: $($appFolder.FullName)"

      - name: Locate main application executable
        id: windows-executable
        shell: pwsh
        run: |
          $appFolder = "${{ steps.windows-app.outputs.path }}"

          $executable = Get-ChildItem -Path $appFolder -File -Filter "*.exe" |
            Where-Object {
              $_.Name -like "*BrickVerse*" -and
              $_.Name -notin @("chrome_crashpad_handler.exe", "elevate.exe")
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $executable) {
            $executable = Get-ChildItem -Path $appFolder -File -Filter "*.exe" |
              Where-Object {
                $_.Name -notin @("chrome_crashpad_handler.exe", "elevate.exe")
              } |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $executable) {
            throw "Could not locate the main BrickVerse executable."
          }

          "path=$($executable.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Main executable: $($executable.FullName)"

      - name: Sign main Windows application
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
          files: ${{ steps.windows-executable.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BrickVerse Installer
          description-url: https://brickverse.gg

      - name: Verify main application signature
        shell: pwsh
        run: |
          $file = "${{ steps.windows-executable.outputs.path }}"
          $signature = Get-AuthenticodeSignature -FilePath $file

          Write-Host "File: $file"
          Write-Host "Status: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

          if ($signature.Status -ne "Valid") {
            throw "Main application signature is invalid: $($signature.Status)"
          }

      - name: Package Windows installer
        shell: pwsh
        run: |
          npx electron-builder `
            --win nsis `
            --x64 `
            --prepackaged "${{ steps.windows-app.outputs.path }}" `
            --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Locate final Windows installer
        id: windows-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -File -Filter "*.exe" |
            Where-Object { $_.Name -notlike "*.__uninstaller.exe" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            Write-Host "Contents of release:"
            Get-ChildItem -Path "release" -Recurse |
              ForEach-Object { Write-Host $_.FullName }
            throw "No final Windows installer was generated."
          }

          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Final installer: $($installer.FullName)"

      - name: Sign final Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
          files: ${{ steps.windows-installer.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BrickVerse Installer
          description-url: https://brickverse.gg

      - name: Verify final Windows installer signature
        shell: pwsh
        run: |
          $file = "${{ steps.windows-installer.outputs.path }}"
          $signature = Get-AuthenticodeSignature -FilePath $file

          Write-Host "File: $file"
          Write-Host "Status: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

          if ($signature.Status -ne "Valid") {
            throw "Final installer signature is invalid: $($signature.Status)"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS application
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux application
        run: npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish Release
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

          mapfile -d '' files < <(find release-assets -type f -print0)

          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts were downloaded."
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
